<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarto vs GA Bot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header>
      <h1>Quarto <span class="subtitle">vs 遺伝的アルゴリズムbot</span></h1>
      <div class="controls">
        <label>
          先手
          <select id="first-player">
            <option value="human">あなた</option>
            <option value="bot">bot</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="squares-rule">
          2x2ルール
        </label>
        <button id="new-game-btn">New Game</button>
      </div>
    </header>

    <main>
      <section class="board-section">
        <div id="board" class="board"></div>
        <div id="status" class="status">New Gameを押して開始してください</div>
      </section>

      <aside class="side-panel">
        <div id="pending-piece-panel" class="panel hidden">
          <h2>あなたが置く駒</h2>
          <div id="pending-piece" class="piece-slot"></div>
          <p class="hint">盤面の空いているマスをクリックして置いてください</p>
        </div>

        <div id="select-panel" class="panel hidden">
          <h2>相手に渡す駒を選ぶ</h2>
          <div id="piece-picker" class="piece-grid"></div>
        </div>

        <div class="panel">
          <h2>対戦ログ</h2>
          <ul id="log" class="log"></ul>
        </div>
      </aside>
    </main>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
